<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pitchside.svg?v=charcoal-round" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="K리그1과 K리그2의 경기, 사람, 전술을 읽는 Pitchside. 경기장 가까이에서 우리 축구의 이야기를 전합니다." />
    <meta name="theme-color" content="#F5F4F0" />
    <script id="pitchside-theme-bootstrap">
      try {
        const preferences = JSON.parse(localStorage.getItem('pitchside:reader-preferences:v1') || 'null');
        document.documentElement.dataset.seedColorMode = preferences?.theme === 'dark' ? 'dark-only' : 'light-only';
      } catch {
        document.documentElement.dataset.seedColorMode = 'light-only';
      }
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preload" href="/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
    <title>pitchside</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
